# TaskFlow — Build & Release Pipeline
#
# HOW TO RELEASE
# ══════════════
# 1. Bump the version in package.json  (e.g. 0.1.0 → 0.2.0)
# 2. Commit:  git add package.json && git commit -m "chore: release v0.2.0"
# 3. Tag:     git tag v0.2.0
# 4. Push:    git push origin main --tags
#
# That push triggers TWO workflows:
#   • deno.yml         — CI: typecheck + lint + build (runs independently)
#   • this file        — ci-gate (lint/typecheck) → build Win/Mac/Linux
#                        → on v*.*.* tag: publish GitHub Release
#
# GATE RULE
# ═════════
# Jobs 2-4 (build-windows, build-macos, build-linux) all require Job 1
# (ci-gate) to succeed first.  A push with lint errors or type errors will
# fail fast without ever starting expensive platform build runners.
#
# ON PLAIN push to main (no tag)
# ══════════════════════════════
# ci-gate + the three build jobs run.  Installers are uploaded as GitHub
# Actions workflow artefacts (available for 7 days).  No Release is created.
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Release

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]      # every push to main → lint-gate + build artefacts
    tags:     ["v*.*.*"]    # version tag        → lint-gate + build + publish

permissions:
  contents: write           # needed to create releases and upload assets

# ── Shared env ─────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  ELECTRON_CACHE: ~/.cache/electron
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder
  # Point the electron downloader at the official GitHub mirror so it never
  # hits the flaky release-assets CDN that causes the wsarecv disconnections.
  ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"
  # Retry failed chunk downloads up to 3 times before failing the job.
  ELECTRON_CUSTOM_DIR: "{{ version }}"

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # Job 1 — CI Gate  (typecheck + lint)
  # All build jobs declare `needs: ci-gate` so they never start on broken code.
  # ══════════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: ✅ Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (skip postinstall — no electron-rebuild needed)
        run: npm ci --ignore-scripts --workspaces false

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint (zero-warnings policy)
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 2 — Windows (.exe NSIS installer)
  # ══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows installer
    runs-on: windows-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass
    # Windows electron cache lives under LOCALAPPDATA, not ~/.cache
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      # Keep the mirror override for Windows too (overrides the top-level env)
      ELECTRON_MIRROR: "https://github.com/electron/electron/releases/download/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ── Cache Electron binary BEFORE npm ci so the install step finds it ──────
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-win32-x64-v28.3.3
          restore-keys: |
            electron-win32-x64-

      - name: Cache electron-builder assets
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-win32-x64-v24
          restore-keys: |
            electron-builder-win32-x64-

      - name: Install dependencies
        # --ignore-scripts skips the postinstall electron-rebuild — we run it
        # explicitly below so it targets the correct Electron ABI headers.
        run: npm ci --ignore-scripts --workspaces false

      - name: Rebuild better-sqlite3 for Electron
        # Use electron-builder's bundled @electron/rebuild (no separate dep needed)
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package Windows installer (NSIS .exe)
        # --publish never  →  electron-builder must not try to auto-publish;
        # the publish-release job handles all GitHub Release uploads.
        run: npx electron-builder --win --config electron-builder.config.js --publish never

      - name: Upload Windows installer as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe          # "TaskFlow Setup <version>.exe"
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 3 — macOS (.dmg)
  # ══════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-darwin-${{ runner.arch }}-v28.3.3
          restore-keys: |
            electron-darwin-${{ runner.arch }}-

      - name: Cache electron-builder assets
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-darwin-${{ runner.arch }}-v24
          restore-keys: |
            electron-builder-darwin-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces false

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package macOS DMG
        run: npx electron-builder --mac --config electron-builder.config.js --publish never

      - name: Upload macOS DMG as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 4 — Linux (.AppImage + .deb)
  # ══════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Build Linux AppImage + deb
    runs-on: ubuntu-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-linux-x64-v28.3.3
          restore-keys: |
            electron-linux-x64-

      - name: Cache electron-builder assets
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-linux-x64-v24
          restore-keys: |
            electron-builder-linux-x64-

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces false

      - name: Install Linux native build dependencies
        # libsecret: keychain  |  libnotify: notifications
        # fakeroot + dpkg: required by electron-builder's .deb target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsecret-1-dev libnotify-bin fakeroot dpkg

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --config electron-builder.config.js --publish never

      - name: Upload Linux AppImage as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux .deb as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 5 — Publish GitHub Release   (ONLY on v*.*.* version tags)
  # ══════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]

    steps:
      - name: Checkout (full history for auto-generated release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download all installer artefacts from the three build jobs ────────────
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release-assets/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release-assets/macos

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: installer-linux-appimage
          path: release-assets/linux

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: installer-linux-deb
          path: release-assets/linux

      - name: List release assets (sanity check)
        run: find release-assets -type f | sort

      # ── Create the GitHub Release and attach all installers ───────────────────
      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ github.ref_name }}
          name:                 "TaskFlow ${{ github.ref_name }}"
          draft:                false
          prerelease:           false
          generate_release_notes: true
          files: |
            release-assets/windows/*.exe
            release-assets/macos/*.dmg
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
          body: |
            ## TaskFlow ${{ github.ref_name }}

            ### 📥 Downloads

            | Platform | Installer | Notes |
            |---|---|---|
            | 🪟 Windows | `TaskFlow Setup *.exe` | NSIS installer — 64-bit |
            | 🍎 macOS | `TaskFlow*.dmg` | Universal DMG (Intel + Apple Silicon) |
            | 🐧 Linux | `TaskFlow*.AppImage` | Portable — no install needed |
            | 🐧 Linux | `taskflow*.deb` | Debian / Ubuntu package |

            ### 🚀 Installation

            **Windows** — run the `.exe` installer and follow the wizard.

            **macOS** — open the `.dmg`, drag TaskFlow to Applications. On first launch: right-click → Open if Gatekeeper blocks it.

            **Linux AppImage**
            ```bash
            chmod +x TaskFlow*.AppImage
            ./TaskFlow*.AppImage
            ```

            **Linux deb**
            ```bash
            sudo dpkg -i taskflow*.deb
            ```

            > 📖 First-time setup: [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
