# TaskFlow — Build & Release Pipeline
#
# HOW TO RELEASE
# ══════════════
# 1. Bump the version in package.json  (e.g. 0.1.0 → 0.2.0)
# 2. Commit:  git add package.json && git commit -m "chore: release v0.2.0"
# 3. Tag:     git tag v0.2.0
# 4. Push:    git push origin main --tags
#
# That push triggers TWO workflows:
#   • deno.yml         — CI: typecheck + lint + build (runs independently)
#   • this file        — ci-gate (lint/typecheck) → build Win/Mac/Linux
#                        → on v*.*.* tag: publish GitHub Release
#
# GATE RULE
# ═════════
# Jobs 2-4 (build-windows, build-macos, build-linux) all require Job 1
# (ci-gate) to succeed first.  A push with lint errors or type errors will
# fail fast without ever starting expensive platform build runners.
#
# ON PLAIN push to main (no tag)
# ══════════════════════════════
# ci-gate + the three build jobs run.  Installers are uploaded as GitHub
# Actions workflow artefacts (available for 7 days).  No Release is created.
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Release

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]      # every push to main → lint-gate + build artefacts
    tags:     ["v*.*.*"]    # version tag        → lint-gate + build + publish

permissions:
  contents: write           # needed to create releases and upload assets

# ── Shared env ─────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  ELECTRON_VER: "28.3.3"
  # NOTE: ELECTRON_BUILDER_CACHE is intentionally NOT set here.
  # GitHub Actions does not shell-expand ~ in env: blocks, so setting
  # ~/.cache/electron-builder would pass a literal tilde to 7zip and fail.
  # Each job resolves $HOME at shell runtime inside its own run: steps.

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # Job 1 — CI Gate  (typecheck + lint)
  # All build jobs declare `needs: ci-gate` so they never start on broken code.
  # ══════════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: ✅ Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (skip postinstall — no electron-rebuild needed)
        run: npm ci --ignore-scripts --workspaces false

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint (zero-warnings policy)
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 2 — Windows (.exe NSIS installer)
  # ══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows installer
    runs-on: windows-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache electron-builder directory
        uses: actions/cache@v4
        with:
          # Use LOCALAPPDATA-relative path; avoids tilde-expansion issues on Windows
          path: ${{ github.workspace }}\.cache\electron-builder
          key: electron-builder-win32-x64-${{ env.ELECTRON_VER }}
          restore-keys: electron-builder-win32-x64-

      # Pre-download the Electron zip straight into the builder cache so the
      # Go app-builder binary finds it locally and never hits the network.
      # Path convention: <ELECTRON_BUILDER_CACHE>/electron/<ver>/<filename>
      - name: Pre-download Electron zip (Windows)
        shell: pwsh
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
        run: |
          $ver  = "${{ env.ELECTRON_VER }}"
          $file = "electron-v${ver}-win32-x64.zip"
          $dir  = "$env:ELECTRON_BUILDER_CACHE\electron\$ver"
          $dest = "$dir\$file"
          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $url = "https://github.com/electron/electron/releases/download/v${ver}/${file}"
            Write-Host "Downloading $url"
            $attempt = 0
            do {
              $attempt++
              try {
                Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
                Write-Host "Downloaded on attempt $attempt"
                break
              } catch {
                Write-Warning "Attempt $attempt failed: $_"
                if ($attempt -ge 3) { throw }
                Start-Sleep -Seconds 10
              }
            } while ($true)
          } else {
            Write-Host "Cache hit — skipping download"
          }

      - name: Install dependencies
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
        run: npm ci --ignore-scripts --workspaces false

      - name: Rebuild better-sqlite3 for Electron
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package Windows installer (NSIS .exe)
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
        run: npx electron-builder --win --config electron-builder.config.js --publish never

      - name: Upload Windows installer as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe          # "TaskFlow Setup <version>.exe"
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 3 — macOS (.dmg)
  # ══════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache electron-builder directory
        uses: actions/cache@v4
        with:
          # $HOME expands correctly here because actions/cache resolves it
          path: ~/Library/Caches/electron-builder
          key: electron-builder-darwin-${{ runner.arch }}-${{ env.ELECTRON_VER }}
          restore-keys: electron-builder-darwin-${{ runner.arch }}-

      # macos-latest is arm64; we only build the native arm64 target.
      # x64 cross-compile requires Rosetta and significantly longer build times.
      - name: Pre-download Electron zip (macOS arm64)
        run: |
          VER="${{ env.ELECTRON_VER }}"
          CACHE="$HOME/Library/Caches/electron-builder"
          FILE="electron-v${VER}-darwin-arm64.zip"
          DIR="${CACHE}/electron/${VER}"
          DEST="${DIR}/${FILE}"
          if [ ! -f "$DEST" ]; then
            mkdir -p "$DIR"
            URL="https://github.com/electron/electron/releases/download/v${VER}/${FILE}"
            echo "Downloading $URL"
            curl -fL --retry 3 --retry-delay 10 -o "$DEST" "$URL"
          else
            echo "Cache hit — skipping download"
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces false

      - name: Rebuild better-sqlite3 for Electron
        env:
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package macOS DMG
        env:
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder
        run: npx electron-builder --mac --config electron-builder.config.js --publish never

      - name: Upload macOS DMG as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 4 — Linux (.AppImage + .deb)
  # ══════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Build Linux AppImage + deb
    runs-on: ubuntu-latest
    needs: ci-gate              # ← only runs if lint + typecheck pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache electron-builder directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-linux-x64-${{ env.ELECTRON_VER }}
          restore-keys: electron-builder-linux-x64-

      # Resolve $HOME at shell runtime — never use ~ in env: blocks as GitHub
      # Actions does not expand it, causing 7zip to receive a literal tilde path.
      - name: Pre-download Electron zip (Linux)
        run: |
          VER="${{ env.ELECTRON_VER }}"
          CACHE="$HOME/.cache/electron-builder"
          FILE="electron-v${VER}-linux-x64.zip"
          DIR="${CACHE}/electron/${VER}"
          DEST="${DIR}/${FILE}"
          if [ ! -f "$DEST" ]; then
            mkdir -p "$DIR"
            URL="https://github.com/electron/electron/releases/download/v${VER}/${FILE}"
            echo "Downloading $URL"
            curl -fL --retry 3 --retry-delay 10 -o "$DEST" "$URL"
          else
            echo "Cache hit — skipping download"
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces false

      - name: Install Linux native build dependencies
        # libsecret: keychain  |  libnotify: notifications
        # fakeroot + dpkg: required by electron-builder's .deb target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsecret-1-dev libnotify-bin fakeroot dpkg

      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-builder install-app-deps

      - name: Build Vite + electron-vite bundles
        run: npm run build

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --config electron-builder.config.js --publish never

      - name: Upload Linux AppImage as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux .deb as artefact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 5 — Publish GitHub Release   (ONLY on v*.*.* version tags)
  # ══════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]

    steps:
      - name: Checkout (full history for auto-generated release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download all installer artefacts from the three build jobs ────────────
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release-assets/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: release-assets/macos

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: installer-linux-appimage
          path: release-assets/linux

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: installer-linux-deb
          path: release-assets/linux

      - name: List release assets (sanity check)
        run: find release-assets -type f | sort

      # ── Create the GitHub Release and attach all installers ───────────────────
      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name:             ${{ github.ref_name }}
          name:                 "TaskFlow ${{ github.ref_name }}"
          draft:                false
          prerelease:           false
          generate_release_notes: true
          files: |
            release-assets/windows/*.exe
            release-assets/macos/*.dmg
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
          body: |
            ## TaskFlow ${{ github.ref_name }}

            ### 📥 Downloads

            | Platform | Installer | Notes |
            |---|---|---|
            | 🪟 Windows | `TaskFlow Setup *.exe` | NSIS installer — 64-bit |
            | 🍎 macOS | `TaskFlow*.dmg` | Universal DMG (Intel + Apple Silicon) |
            | 🐧 Linux | `TaskFlow*.AppImage` | Portable — no install needed |
            | 🐧 Linux | `taskflow*.deb` | Debian / Ubuntu package |

            ### 🚀 Installation

            **Windows** — run the `.exe` installer and follow the wizard.

            **macOS** — open the `.dmg`, drag TaskFlow to Applications. On first launch: right-click → Open if Gatekeeper blocks it.

            **Linux AppImage**
            ```bash
            chmod +x TaskFlow*.AppImage
            ./TaskFlow*.AppImage
            ```

            **Linux deb**
            ```bash
            sudo dpkg -i taskflow*.deb
            ```

            > 📖 First-time setup: [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
