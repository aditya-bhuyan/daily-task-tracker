# TaskFlow — Publish to GitHub Packages (npm registry)
#
# This workflow publishes the TaskFlow package to the GitHub Packages npm
# registry whenever a version tag (v*.*.*) is pushed.
#
# WHAT IS PUBLISHED
# ═════════════════
# The package published here is the SOURCE package (React + TypeScript
# component library / app skeleton), not the Electron installers.
# It lets other developers install and build on top of TaskFlow:
#
#   npm install @<your-github-username>/daily-task-tracker
#
# The Electron installers (the actual desktop app downloads) are published
# as GitHub Release assets by npm-publish.yml.
#
# PREREQUISITES
# ═════════════
# No extra secrets needed — GITHUB_TOKEN has write:packages permission by
# default on any GitHub repository.
#
# HOW TO RELEASE
# ══════════════
# Same as npm-publish.yml:
#   1. Bump version in package.json
#   2. git commit + git tag v0.2.0
#   3. git push origin main --tags
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Publish to GitHub Packages

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  push:
    tags: ["v*.*.*"]    # only run on version tags, not on plain branch pushes

permissions:
  contents: read
  packages: write       # required to publish to GitHub Packages

env:
  NODE_VERSION: "20"

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # Job 1 — Lint gate (fail fast before touching the registry)
  # ══════════════════════════════════════════════════════════════════════════════
  lint-gate:
    name: ✅ Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint (zero-warnings policy)
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 2 — Publish to GitHub Packages npm registry
  # ══════════════════════════════════════════════════════════════════════════════
  publish-github-packages:
    name: 📦 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: lint-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure Node with GitHub Packages registry as the publish target.
      # The registry-url is what tells npm to push to packages.github.com
      # instead of the public npmjs.com registry.
      - name: Setup Node.js — GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          # scope must match your GitHub username / org (set in package.json name too)
          scope: "@adityabhuyan"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Derive the version from the git tag (strips leading "v")
      # e.g. tag v0.2.0  →  package version 0.2.0
      - name: Sync package.json version with git tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The package.json `name` field must be scoped to match your GitHub account.
      # We patch it here so the source file stays as "daily-task-tracker"
      # while the published package is "@adityabhuyan/daily-task-tracker".
      - name: Scope package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.name = '@adityabhuyan/daily-task-tracker';
            // Point the registry at GitHub Packages for this scope
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # Publish — the NODE_AUTH_TOKEN env var is used by npm to authenticate.
      # GITHUB_TOKEN is automatically available; no manual secret setup needed.
      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 📦 Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`@adityabhuyan/daily-task-tracker@${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @adityabhuyan/daily-task-tracker" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View:** https://github.com/${{ github.repository }}/pkgs/npm/daily-task-tracker" >> $GITHUB_STEP_SUMMARY
