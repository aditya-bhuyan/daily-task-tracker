# TaskFlow — Publish to GitHub Packages (npm registry)
#
# This workflow publishes the TaskFlow package to the GitHub Packages npm
# registry whenever a version tag (v*.*.*) is pushed.
#
# SCOPE RULE (critical!)
# ═══════════════════════
# GitHub Packages npm scope MUST exactly match the repository owner's
# GitHub username — including hyphens and case.
#
#   Repo URL  : https://github.com/aditya-bhuyan/daily-task-tracker
#   Owner     : aditya-bhuyan   ← hyphen, all lowercase
#   Scope     : @aditya-bhuyan  ← must match exactly
#
# The old scope "@adityabhuyan" (no hyphen) caused the 403 "owner not found".
#
# WHAT IS PUBLISHED
# ═════════════════
# The source package (React + TypeScript component library / app skeleton).
# Install with:   npm install @aditya-bhuyan/daily-task-tracker
#
# Electron installers are published as GitHub Release assets by npm-publish.yml.
#
# PREREQUISITES
# ═════════════
# No extra secrets needed — GITHUB_TOKEN has write:packages by default.
#
# HOW TO RELEASE
# ══════════════
#   1. Bump version in package.json
#   2. git commit + git tag v0.2.0
#   3. git push origin main --tags
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Publish to GitHub Packages

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  push:
    tags: ["v*.*.*"]    # only run on version tags, not on plain branch pushes

permissions:
  contents: read
  packages: write       # required to publish to GitHub Packages

env:
  NODE_VERSION: "20"

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # Job 1 — Lint gate (fail fast before touching the registry)
  # ══════════════════════════════════════════════════════════════════════════════
  lint-gate:
    name: ✅ Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint (zero-warnings policy)
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════════
  # Job 2 — Publish to GitHub Packages npm registry
  # ══════════════════════════════════════════════════════════════════════════════
  publish-github-packages:
    name: 📦 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: lint-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # registry-url tells npm to push to packages.github.com instead of npmjs.com.
      # scope MUST match the GitHub repo owner username exactly — with hyphens.
      - name: Setup Node.js — GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@aditya-bhuyan"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Strip the leading "v" from the tag to get a valid semver version.
      # e.g.  tag v0.2.0  →  npm version 0.2.0
      - name: Sync package.json version with git tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Patch the package name to the scoped form required by GitHub Packages.
      # Source file keeps "daily-task-tracker"; published as "@aditya-bhuyan/daily-task-tracker".
      # github.repository_owner resolves to "aditya-bhuyan" automatically —
      # no hard-coded username in the script body.
      - name: Scope package name for GitHub Packages
        run: |
          OWNER="${{ github.repository_owner }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@' + process.env.OWNER + '/daily-task-tracker';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        env:
          OWNER: ${{ github.repository_owner }}

      # NODE_AUTH_TOKEN must be set for npm to authenticate against GitHub Packages.
      # GITHUB_TOKEN is available automatically — no manual secret required.
      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 📦 Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`@${{ github.repository_owner }}/daily-task-tracker@${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @${{ github.repository_owner }}/daily-task-tracker" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View:** https://github.com/${{ github.repository }}/pkgs/npm/daily-task-tracker" >> $GITHUB_STEP_SUMMARY
