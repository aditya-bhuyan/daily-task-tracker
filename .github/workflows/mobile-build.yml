# TaskFlow Mobile — Android APK / AAB Build via Expo EAS
#
# TRIGGERS
# ════════
#   • v*.*.* version tags → build production .aab (Play Store ready)
#   • Manual dispatch     → choose profile (development/preview/production)
#
# REPO STRUCTURE NOTE
# ═══════════════════
# The GitHub repo (aditya-bhuyan/daily-task-tracker) contains only the
# desktop app source. When this workflow checks out the repo, the runner
# workspace root IS the desktop app root — there is no monorepo prefix.
#
# The mobile app (taskflow-mobile/) and shared package (packages/shared/)
# exist only on the developer's local machine and are not yet pushed to
# GitHub. The shared-typecheck job is therefore a no-op placeholder until
# those directories are committed to the repo.
#
# PREREQUISITES (before first successful run)
# ════════════════════════════════════════════
#   1. Push taskflow-mobile/ and packages/shared/ to the repo
#   2. Create an Expo account and run `eas init` in taskflow-mobile/
#   3. Add EXPO_TOKEN as a GitHub repository secret
#      (Settings → Secrets → New repository secret)
#   4. Replace REPLACE_WITH_EAS_PROJECT_ID in taskflow-mobile/app.json
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Mobile — Android Build (EAS)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS Build profile"
        required:    true
        default:     "preview"
        type:        choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1 — Typecheck @taskflow/shared
  # Skipped gracefully if packages/shared is not yet in the repo.
  # ════════════════════════════════════════════════════════════════════════════
  shared-typecheck:
    name: ✅ Shared package typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check if shared package exists in repo
        id: check
        run: |
          if [ -f "packages/shared/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ packages/shared not found in repo — skipping typecheck."
            echo "Push taskflow-mobile/ and packages/shared/ to enable this step."
          fi

      - name: Install shared package dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/shared
        run: npm install --ignore-scripts

      - name: Typecheck @taskflow/shared
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/shared
        run: npm run typecheck

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2 — EAS Build Android
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: 🤖 Android EAS Build
    runs-on: ubuntu-latest
    needs: shared-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup EAS CLI + authenticate
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token:       ${{ secrets.EXPO_TOKEN }}

      - name: Check if mobile app exists in repo
        id: check_mobile
        run: |
          if [ -f "taskflow-mobile/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ taskflow-mobile/ not found in repo — skipping EAS build."
            echo "Push taskflow-mobile/ to the repository to enable this step."
          fi

      - name: Install mobile dependencies
        if: steps.check_mobile.outputs.exists == 'true'
        working-directory: taskflow-mobile
        run: npm install --ignore-scripts

      - name: Determine build profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build — Android
        if: steps.check_mobile.outputs.exists == 'true'
        working-directory: taskflow-mobile
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Annotate GitHub Release with EAS build link (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_mobile.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 Android Build

            An **EAS Build** for the TaskFlow Mobile app has been triggered for `${{ github.ref_name }}`.

            ➡️ Check the build status at:
            https://expo.dev/accounts/${{ github.repository_owner }}/projects/taskflow-mobile/builds

            Once complete, download the APK/AAB directly from the Expo dashboard.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
