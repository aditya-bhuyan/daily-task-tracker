# TaskFlow Mobile — Android APK / AAB Build via Expo EAS
#
# TRIGGERS
# ════════
#   • v*.*.* version tags → build production .aab (Play Store ready)
#   • Manual dispatch     → choose profile (development/preview/production)
#
# PREREQUISITES (one-time setup — already scaffolded, just needs secrets)
# ════════════════════════════════════════════════════════════════════════
#   1. Create an Expo account and run `eas init` inside taskflow-mobile/
#      then commit the updated app.json (fills in the real EAS projectId)
#   2. Add EXPO_TOKEN as a GitHub repository secret
#      (Settings → Secrets → New repository secret)
#
# Author: Aditya Pratap Bhuyan  https://linkedin.com/in/adityabhuyan

name: Mobile — Android Build (EAS)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS Build profile"
        required:    true
        default:     "preview"
        type:        choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1 — Typecheck @taskflow/shared
  # ════════════════════════════════════════════════════════════════════════════
  shared-typecheck:
    name: ✅ Shared package typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install shared package dependencies
        working-directory: packages/shared
        run: npm install --ignore-scripts

      - name: Typecheck @taskflow/shared
        working-directory: packages/shared
        run: npm run typecheck

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2 — EAS Build Android
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: 🤖 Android EAS Build
    runs-on: ubuntu-latest
    needs: shared-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup EAS CLI + authenticate
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token:       ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: taskflow-mobile
        run: npm install --ignore-scripts

      - name: Determine build profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build — Android
        working-directory: taskflow-mobile
        run: |
          eas build \
            --platform android \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Annotate GitHub Release with EAS build link (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 Android Build

            An **EAS Build** for the TaskFlow Mobile app has been triggered for `${{ github.ref_name }}`.

            ➡️ Check the build status at:
            https://expo.dev/accounts/${{ github.repository_owner }}/projects/taskflow-mobile/builds

            Once complete, download the APK/AAB directly from the Expo dashboard.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
